# Banco local identico ao de producao (regra do CLAUDE.md: nunca SQLite).
#
#   docker compose up -d      sobe Postgres + Redis + MinIO
#   docker compose down       para (dados ficam no volume)
#   docker compose down -v    APAGA os dados — nao use sem backup
#
# Portas fora do padrao para nao colidir com os outros projetos da maquina
# (5432 padrao, 5433 espaco-flow, 5434 orbital, 5435 bahflash, 5436 mm).

services:
  db:
    image: postgres:16
    container_name: merlostore_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: merlostore_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d merlostore_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fila FIFO (BullMQ): envio de mensagens, broadcasts, transcricao de audio.
  redis:
    image: redis:7-alpine
    container_name: merlostore_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6382:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Armazenamento de midia (ADR 0006). S3-compativel: o mesmo codigo fala com
  # este MinIO em dev e com o MinIO da VPS em producao.
  #
  # Console web: http://localhost:9003 (usuario/senha abaixo)
  minio:
    image: minio/minio:latest
    container_name: merlostore_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev
      MINIO_ROOT_PASSWORD: devdevdev
    ports:
      - "9002:9000"   # API S3
      - "9003:9001"   # console web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cria o bucket na subida. Sem isto o primeiro upload falha com NoSuchBucket,
  # e o bucket nasce PRIVADO — foto de cliente nao fica em URL publica.
  minio-init:
    image: minio/mc:latest
    container_name: merlostore_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dev devdevdev &&
      mc mb --ignore-existing local/merlostore-midia &&
      mc anonymous set none local/merlostore-midia &&
      echo 'bucket merlostore-midia pronto (privado)'
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
